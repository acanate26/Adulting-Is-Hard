<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You clicked it! - Adulting is Hard</title>
<style>
  :root{ --navy:#14123a; --butter:#fff6a8; --pink:#ff2fa6; --lime:#8dff3f; --teal:#00d0c4; --ink:#1b1b1b; }
  html{ box-sizing:border-box; }
  *,*:before,*:after{ box-sizing:inherit; }
  body{
    margin:0; padding:12px; color:var(--ink); min-height:100vh;
    font-family:"Comic Sans MS","Comic Neue","Chalkboard SE","Marker Felt",cursive;
    background-color:var(--navy);
    background-image:
      radial-gradient(#fff 1.2px, transparent 1.6px),
      radial-gradient(var(--teal) 1px, transparent 1.5px),
      radial-gradient(var(--pink) 1.2px, transparent 1.7px);
    background-size:57px 57px, 91px 91px, 133px 133px;
    background-position:0 0, 23px 41px, 60px 12px;
  }
  .wrap{ max-width:640px; margin:0 auto; }
  .box{ background:var(--butter); border:5px ridge var(--teal); padding:16px 20px; margin-bottom:14px; text-align:center; }
  h1{ margin:0 0 6px; font-size:2.2rem; line-height:1.1; color:var(--pink); text-shadow:3px 3px 0 var(--teal); }
  .rainbow{ height:8px; border:0; margin:10px 0; background:linear-gradient(90deg,#f33,#fa0,#ee0,#3c3,#09f,#90f); }

  /* Fake loading bar */
  .bar{ height:28px; background:#fff; border:4px inset #888; margin:12px 0 6px; }
  .fill{ height:100%; width:0; background:repeating-linear-gradient(90deg,var(--pink) 0 14px,#ff8ccd 14px 18px); }
  #status{ font-weight:bold; min-height:1.4em; }

  /* Tip machine */
  #machine{ display:none; }
  .tip{
    background:#fff; border:4px dashed var(--pink); padding:16px; margin:12px 0;
    font-size:1.25rem; min-height:5.5em; display:flex; align-items:center; justify-content:center;
  }
  button, .back{
    font:inherit; font-size:1.3rem; font-weight:bold; color:#fff; cursor:pointer; text-decoration:none;
    background:var(--pink); border:5px outset #ffa0d8; padding:8px 22px; display:inline-block;
  }
  button:active, .back:active{ border-style:inset; background:#c0007a; }
  button:focus-visible, .back:focus-visible{ outline:3px dashed var(--navy); outline-offset:2px; }
  .back{ background:var(--teal); border-color:#7ff5ee; color:var(--ink); font-size:1rem; margin-top:8px; }
  .count{ font-size:.9rem; margin-top:10px; }

  /* Falling confetti */
  .bit{ position:fixed; top:-30px; z-index:9; pointer-events:none; font-size:24px;
        transition:transform 2.2s ease-in, opacity 2.2s ease-in; }
</style>
</head>
<body>
<div class="wrap">

  <div class="box">
    <h1>&#127881; You clicked it! &#127881;</h1>
    <hr class="rainbow">
    <div id="loader">
      <p style="margin:0">Preparing your adulting...</p>
      <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <div id="status" role="status" aria-live="polite">0%</div>
    </div>

    <div id="machine">
      <p style="margin:0 0 4px"><b>The Random Adulting Tip Machine</b></p>
      <div class="tip" id="tip" aria-live="polite">Press the button for a tip.</div>
      <button id="go" type="button">Give me a tip!</button>
      <div class="count" id="count"></div>
    </div>
  </div>

  <div style="text-align:center">
    <a class="back" href="index.html">&larr; Take me back</a>
  </div>

</div>

<script>
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 1. Fake loading bar: jerky progress that stalls at 99%, then "finishes".
  var fill = document.getElementById('fill');
  var status = document.getElementById('status');
  var loader = document.getElementById('loader');
  var machine = document.getElementById('machine');

  function showMachine(){
    loader.style.display = 'none';
    machine.style.display = 'block';
    document.getElementById('go').focus();
  }

  if (reduce) {
    showMachine();
  } else {
    var pct = 0;
    var notes = ['Finding your keys...', 'Checking the stove is off...', 'Locating a matching sock...', 'Reading the terms and conditions...'];
    (function step(){
      pct += Math.random() < 0.3 ? 0 : Math.ceil(Math.random()*14);   // sometimes it just doesn't move
      if (pct >= 99) {
        fill.style.width = '99%';
        status.textContent = '99% ... still 99% ...';
        setTimeout(function(){
          fill.style.width = '100%';
          status.textContent = 'Done! That took longer than expected. Very adult.';
          setTimeout(showMachine, 1100);
        }, 1600);
        return;
      }
      fill.style.width = pct + '%';
      status.textContent = pct + '% - ' + notes[Math.floor(pct / 26) % notes.length];
      setTimeout(step, 260 + Math.random()*320);
    })();
  }

  // 2. The tip machine
  var tips = [
    'Water is a perfectly good thing to drink with dinner. Your wallet will notice.',
    'Wash new dark clothes inside out and in cold water, and they will stay dark much longer.',
    'Book the appointment now. Future you does not want to make that call either.',
    'Before you buy it, wait 24 hours. If you still want it tomorrow, it is a real want.',
    'Cook a big batch of one thing on Sunday and you have three dinners sorted.',
    'Put bills on autopay, then check the account once a month so nothing surprises you.',
    'Keep one go-to dinner you can make half asleep. Eggs and toast count.',
    'Feeling off is a good enough reason to ask someone for help. You do not need a crisis first.',
    'Read the care label. The little tub symbols are a secret code, and they are worth learning.',
    'Set a calendar reminder for the boring stuff: renewals, refills, check-ups.',
    'Keep a small emergency fund, even if it starts at ten dollars a week.',
    'Taste your food while you cook. Salt a little at a time.',
    'Rest is part of the checklist, so add it to the list.'
  ];
  var last = -1, seen = 0;
  var tipBox = document.getElementById('tip');
  var countBox = document.getElementById('count');
  var emoji = ['\uD83C\uDF89','\u2728','\uD83C\uDF88','\u2B50','\uD83E\uDDFA','\uD83C\uDF55','\uD83D\uDCB8','\uD83C\uDF1F'];

  function confetti(){
    if (reduce) return;
    for (var i = 0; i < 36; i++) {
      var b = document.createElement('div');
      b.className = 'bit';
      b.textContent = emoji[Math.floor(Math.random()*emoji.length)];
      b.style.left = Math.random()*100 + 'vw';
      document.body.appendChild(b);
      (function(el){
        // Wait a frame so the browser registers the start position, then animate to the end.
        requestAnimationFrame(function(){
          el.style.transform = 'translateY(' + (window.innerHeight + 60) + 'px) rotate(' + (Math.random()*720 - 360) + 'deg)';
          el.style.opacity = '0';
        });
        setTimeout(function(){ el.remove(); }, 2300);
      })(b);
    }
  }

  document.getElementById('go').addEventListener('click', function(){
    var i;
    do { i = Math.floor(Math.random()*tips.length); } while (i === last);   // never the same tip twice in a row
    last = i;
    tipBox.textContent = tips[i];
    seen++;
    countBox.textContent = 'Tips unlocked: ' + seen + (seen >= 5 ? ' - look at you, thriving!' : '');
    confetti();
  });
</script>
</body>
</html>
